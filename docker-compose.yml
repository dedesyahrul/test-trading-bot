version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: memex-postgres
    environment:
      POSTGRES_USER: memex
      POSTGRES_PASSWORD: memex
      POSTGRES_DB: memex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memex-network

  redis:
    image: redis:7-alpine
    container_name: memex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memex-network

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: memex-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://memex:memex@postgres:5432/memex
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      TRADING_MODE: ${TRADING_MODE:-PAPER}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - memex-network

  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/worker.Dockerfile
    container_name: memex-worker
    environment:
      DATABASE_URL: postgresql://memex:memex@postgres:5432/memex
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      TRADING_MODE: ${TRADING_MODE:-PAPER}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m arq app.workers.main.WorkerSettings
    networks:
      - memex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: memex-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api
    networks:
      - memex-network

volumes:
  pgdata:
  redis-data:

networks:
  memex-network:
    driver: bridge
